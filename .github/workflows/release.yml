name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            archive: tar.gz
          - name: macos-aarch64
            os: macos-latest
            archive: tar.gz
          - name: macos-x86_64
            os: macos-15-intel
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --bin musictui2

      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        env:
          ASSET_NAME: musictui2-${{ github.ref_name }}-${{ matrix.name }}
        run: |
          mkdir -p dist package
          cp target/release/musictui2 package/musictui2
          chmod +x package/musictui2
          tar -C package -czf "dist/${ASSET_NAME}.tar.gz" musictui2
          shasum -a 256 "dist/${ASSET_NAME}.tar.gz" > "dist/${ASSET_NAME}.tar.gz.sha256"

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          ASSET_NAME: musictui2-${{ github.ref_name }}-${{ matrix.name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist, package
          Copy-Item target/release/musictui2.exe package/musictui2.exe
          Compress-Archive -Path package/musictui2.exe -DestinationPath "dist/${env:ASSET_NAME}.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${env:ASSET_NAME}.zip").Hash.ToLower()
          "$hash  ${env:ASSET_NAME}.zip" | Out-File -Encoding ascii "dist/${env:ASSET_NAME}.zip.sha256"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
